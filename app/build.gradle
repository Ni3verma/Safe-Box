plugins {
    alias(libs.plugins.google.services)
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.hilt)
    alias(libs.plugins.ksp)
    alias(libs.plugins.crashlytics)
}

ksp {
    arg "room.schemaLocation", "${projectDir}/schemas"
    arg "room.incremental", "true"
    arg "room.expandProjection", "true"
}

// version code will be incremental unique github run runner and default to a high value for local builds
def version_code = (System.getenv("GITHUB_RUN_NUMBER") ?: "9999984").toInteger() + 15

// actual version_name(from CI) follows the pattern :majorVersion.minorVersion.dbVersion.fixVersion
// so our tag is like v2.0.4.0
def githubRef = System.getenv("GITHUB_REF_NAME") // e.g., 'v2.0.4.0' or 'master'

android {
    namespace 'com.andryoga.safebox'
    compileSdk = 37

    defaultConfig {
        applicationId "com.andryoga.safebox"
        minSdk 24
        targetSdk 37
        versionCode version_code

        // versionName logic
        if (githubRef != null && githubRef.startsWith("v")) {
            versionName githubRef.substring(1) // Strips 'v' from 'v2.0.4.0'
        } else if (githubRef != null) {
            versionName "${githubRef}-build.${version_code}" // e.g., master-build.145
        } else {
            versionName "LOCAL-build"
        }
        println "Building SafeBox: ${versionName} (${versionCode})"

        testInstrumentationRunner "com.andryoga.safebox.CustomHiltTestRunner"

        // Play in-app updates can only succeed for the applicationId installed from Play, so every
        // build type is off unless it opts in. Only release does. See docs/architecture/in-app-updates.md
        buildConfigField "boolean", "IN_APP_UPDATE_ENABLED", "false"
    }

    signingConfigs {
        release {
            // Load releaseKeyStore.properties in an object
            // if you want to make release build in your local then make a releaseKeyStore.properties file with below keys at root level
            // also store your release key store (*.jks) file and mention path in STORE_FILE property
            // both these files are meant to be stored only locally and not committed to VCS
            def localReleaseKeyStoreProperties = new Properties()
            localReleaseKeyStoreProperties.load(new FileInputStream(rootProject.file("releaseKeyStore.properties")))
            storeFile file(localReleaseKeyStoreProperties['STORE_FILE'])
            storePassword localReleaseKeyStoreProperties['STORE_PASSWORD']
            keyPassword localReleaseKeyStoreProperties['KEY_PASSWORD']
            keyAlias localReleaseKeyStoreProperties['KEY_ALIAS']
        }
        qa {
            def nonProdKeyStoreProperties = new Properties()
            nonProdKeyStoreProperties.load(new FileInputStream(rootProject.file("nonProdReleaseKeyStore.properties")))
            storeFile file(nonProdKeyStoreProperties['STORE_FILE'])
            storePassword nonProdKeyStoreProperties['STORE_PASSWORD']
            keyPassword nonProdKeyStoreProperties['KEY_PASSWORD']
            keyAlias nonProdKeyStoreProperties['KEY_ALIAS']
        }
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            variant.outputs.each { output ->
                // if you are changing apk name then also change name in git workflow file.
                output.outputFileName.set("SafeBox-${variant.name}.apk")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            minifyEnabled false
            /**
             * Gated behind -Pcoverage so that everyday debug builds stay fast.
             *
             * enableAndroidTestCoverage makes AGP run JaCoCo offline instrumentation over every
             * class packaged into the APK, which slows down both assembly and the instrumented
             * run. Coverage is only ever needed on demand for test gap analysis, so it is opted
             * into explicitly rather than paid for on every build.
             * */
            enableUnitTestCoverage = project.hasProperty("coverage")
            enableAndroidTestCoverage = project.hasProperty("coverage")
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
            }
            ndk {
                debugSymbolLevel = "FULL"
            }
            buildConfigField "boolean", "IN_APP_UPDATE_ENABLED", "true"
        }
        qa {
            initWith(buildTypes["release"])
            applicationIdSuffix ".qa"
            signingConfig signingConfigs.qa
            buildConfigField "boolean", "IN_APP_UPDATE_ENABLED", "false"
            /**
             * The launcher and biometric-sheet label. "Safe Box QA" tells a QA install apart from
             * the production app installed beside it. The store screenshots are photographed from
             * a QA build (release cannot be built without the production keystore) and the
             * biometric sheet prints this label, so that run builds with -PappLabel="Safe Box".
             * See .agents/skills/store-screenshots/SKILL.md.
             * */
            resValue "string", "app_name", project.findProperty("appLabel") ?: "Safe Box QA"
            firebaseCrashlytics {
                /**
                 * I don't want this to be enabled on local machine or CI because it is an indirect
                 * input to minify task. So if this is enabled, minify task always runs in
                 * incremental build.
                 *
                 * If a crash stack needs to be deobfuscated in future, then either upload the
                 * mapping file manually or make below true temporarily and rebuild the project.
                 * */
                mappingFileUploadEnabled false
                nativeSymbolUploadEnabled true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        named("androidTest") {
            java.srcDirs += ["$buildDir/generated/ksp/debugAndroidTest/kotlin", "$buildDir/generated/ksp/debugAndroidTest/java"]
            assets.srcDirs(files("$projectDir/schemas"))
        }
    }

    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        compose true
        buildConfig true
        // For the qa build type's app_name resValue above; off by default since AGP 8.
        resValues true
    }

    tasks.matching { (it.name.startsWith("compileDebugAndroidTest") || it.name.startsWith("dexBuilderDebugAndroidTest")) && it.name != "kspDebugAndroidTestKotlin" }.configureEach {
        dependsOn("kspDebugAndroidTestKotlin")
    }

    testOptions {
        unitTests.returnDefaultValues = true
        managedDevices {
            localDevices {
                register("pixel8Api34") {
                    device = "Pixel 8"
                    apiLevel = 34
                    systemImageSource = "aosp-atd"
                }
            }
        }
    }
    androidResources {
        // Generates the supported locales config so Android 13+ system settings expose per-app language selection.
        generateLocaleConfig = true
    }

    lint {
        // Local builds (including assembleQa) should not block when a new English string is not yet
        // translated; CI's scripts/tests/translations-test.sh enforces 100% translation completeness.
        warning 'MissingTranslation'
    }

    ndkVersion '29.0.14206865'
}

// Propagates deterministic string key renames, deletions, and translatable="false" removals across
// values-<locale>/strings.xml on local builds without blocking when new English strings await
// translation. In CI, scripts/tests/translations-test.sh runs in strict read-only mode instead.
def syncTranslationsStamp = layout.buildDirectory.file('intermediates/translations-sync/stamp.txt')
def syncTranslationsTask = tasks.register('syncTranslations', Exec) {
    group = 'verification'
    description = 'Propagates deterministic string key renames and deletions across locales on local builds.'
    def isCi = providers.environmentVariable('CI').present
    onlyIf { !isCi }
    inputs.file(layout.projectDirectory.file('src/main/res/values/strings.xml'))
    inputs.files(layout.projectDirectory.dir('src/main/res').asFileTree.matching {
        include 'values-*/strings.xml'
    })
    inputs.file(layout.projectDirectory.file('translations.lock'))
    inputs.file(rootProject.layout.projectDirectory.file('scripts/translations.py'))
    outputs.file(syncTranslationsStamp)
    workingDir = rootProject.projectDir
    commandLine 'python3', 'scripts/translations.py', '--local-sync', '--stamp-file', syncTranslationsStamp.get().asFile.absolutePath
}

tasks.named('preBuild').configure {
    dependsOn(syncTranslationsTask)
}

dependencies {
    // test deps
    androidTestImplementation platform(libs.androidx.compose.bom)
    androidTestImplementation libs.bundles.compose.test

    testImplementation libs.bundles.unit.test

    // debug deps
    debugImplementation libs.bundles.compose.debug

    implementation libs.bundles.androidx
    implementation libs.bundles.work
    implementation libs.timber
    implementation libs.security.crypto
    implementation libs.kotlinx.serialization.json
    implementation libs.biometric
    implementation libs.bundles.play.review
    implementation libs.bundles.play.app.update
    implementation libs.data.store.pref
    implementation libs.bundles.camera

    ksp(libs.room.compiler)
    implementation libs.bundles.room

    ksp(libs.hilt.compiler)
    ksp(libs.androidx.hilt.compiler)
    kspAndroidTest(libs.hilt.compiler)
    kspAndroidTest(libs.androidx.hilt.compiler)
    implementation libs.bundles.hilt

    implementation platform(libs.androidx.compose.bom)
    implementation libs.bundles.compose.ui

    implementation platform(libs.firebase.bom)
    implementation libs.bundles.firebase
}