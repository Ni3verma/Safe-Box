name: Production & RC Release

on:
  push:
    tags: [ 'v*' ] # Triggers for v2.2.5.0, v2.2.5.0-rc1, etc. tag push (vMAJOR.MINOR.DBVERSION.FIX)

jobs:
  # The tag's DBVERSION must equal the Room schema version being shipped. Nothing in the build reads
  # that component, so without this a forgotten bump releases silently and the tag misstates which
  # schema the release carries. It needs no toolchain and runs in seconds; every other job waits on
  # it through `quality`, so a wrong tag fails before lint, tests, signing or publishing. Fix by
  # deleting the tag and re-tagging - nothing will have been released.
  tag_db_version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify the tag's DBVERSION matches the Room schema version
        run: ./scripts/lib/tag-db-version.sh "$GITHUB_REF_NAME"

  quality:
    needs:
      - tag_db_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Run lint
        run: ./gradlew lintRelease

      - name: upload html lint report
        uses: actions/upload-artifact@v7
        with:
          name: lint result
          path: app/build/reports/lint-results-release.html

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented UI Tests (Gradle Managed Device)
        run: ./gradlew pixel8Api34DebugAndroidTest --stacktrace

      - name: upload test result
        if: always() # Upload even if tests fail
        uses: actions/upload-artifact@v7
        with:
          name: Test Reports (Unit & UI)
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/managedDevice/

      - name: Verify NDK Gatekeeper
        run: |
          # 1. Extract the ndk version from app/build.gradle
          REQUIRED_NDK=$(grep "ndkVersion" app/build.gradle | sed "s/.*ndkVersion//" | tr -d "[:space:]'\"")
          
          echo "Checking for NDK Version: [$REQUIRED_NDK]"
          
          NDK_PATH="$ANDROID_HOME/ndk/$REQUIRED_NDK"
          
          # 2. Check if that specific directory exists
          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::NDK Version $REQUIRED_NDK not found on CI runner!"
            echo "Expected path: $NDK_PATH"
            echo "Actually available in $ANDROID_HOME/ndk/:"
            ls "$ANDROID_HOME/ndk/"
            exit 1
          else
            echo "✅ NDK $REQUIRED_NDK found and verified."
          fi

  debug_pipeline:
    needs:
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Build debug apk
        run: ./gradlew assembleDebug --scan

      - name: upload debug apk
        uses: actions/upload-artifact@v7
        with:
          name: debug app
          path: app/build/outputs/apk/debug/SafeBox-debug.apk

  release_pipeline:
    needs:
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Set release key store Properties
        env:
          RELEASE_KEYSTORE_PROPERTIES: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: echo "$RELEASE_KEYSTORE_PROPERTIES" > ./releaseKeyStore.properties

      - name: Prepare keystore
        run: |
          echo "${{ secrets.BASE_64_RELEASE_KEYSTORE }}" > ./releaseKeyStore.jks.asc
          gpg -d --passphrase "${{ secrets.GPG_PASSPHRASE }}" --batch ./releaseKeyStore.jks.asc > ./app/releaseKeyStore.jks

      - name: Prepare google services json
        run: |
          echo "${{ secrets.BASE_64_GOOGLE_SERVICES_JSON }}" > ./app/google-services.json.asc
          gpg -d --passphrase "${{ secrets.GPG_PASSPHRASE }}" --batch ./app/google-services.json.asc > ./app/google-services.json

      - name: Build release bundle
        run: ./gradlew bundleRelease

      - name: upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7

      - name: upload symbols file
        run: ./gradlew uploadCrashlyticsSymbolFileRelease

  qa_pipeline:
    needs:
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Build QA apk
        run: ./gradlew assembleQa --scan

      - name: upload QA apk
        uses: actions/upload-artifact@v7
        with:
          name: QA APK
          path: app/build/outputs/apk/qa/*.apk
          retention-days: 7

      - name: upload QA mapping file
        uses: actions/upload-artifact@v7
        with:
          name: qaMapping
          path: app/build/outputs/mapping/qa/mapping.txt

      - name: upload QA symbols file to crashlytics
        run: ./gradlew uploadCrashlyticsSymbolFileQa

  # Upgrade (N-1 -> this tag) and restore (every backup format) on the QA APK qa_pipeline just
  # built - the file that is about to be published, not a rebuild. Publishing waits for it, on RC
  # and stable tags alike. Called rather than triggered: a release created with GITHUB_TOKEN never
  # starts other workflows. See docs/testing/upgrade-testing.md.
  upgrade_test:
    needs:
      - qa_pipeline
    permissions:
      contents: read
    uses: ./.github/workflows/upgrade-test.yml
    with:
      qa_apk_artifact: QA APK
    secrets: inherit

  release_on_github:
    needs:
      - qa_pipeline
      - release_pipeline
      - upgrade_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Retrieve QA apk
        uses: actions/download-artifact@v8
        with:
          name: QA APK
          path: downloaded-artifacts/

      - name: Retrieve Release AAB
        uses: actions/download-artifact@v8
        with:
          name: release aab
          path: downloaded-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') }}
          generate_release_notes: true # This pulls logic from .github/release.yml
          body: |
            ${{ contains(github.ref_name, 'rc') && '🧪 This is a **Release Candidate** for testing purposes.' || '🚀 This is a **Stable Production** release.' }}
          files: downloaded-artifacts/*
