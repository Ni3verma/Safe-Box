name: CI & Internal Distribution

on:
  pull_request:
    branches: [ "master", "feature/**" ]
  push:
    branches: [ "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Deliberately placed before the JDK, Gradle and emulator setup: these need none of them and
      # finish in seconds, so a documentation problem is reported without first paying for a
      # toolchain.
      #
      # --offline restricts lychee to local files, so this never makes a network request and can
      # never fail because someone else's site is down. It resolves relative links, reference-style
      # definitions and bracketed destinations through a real CommonMark parser, and reports
      # root-relative targets like /etc/hosts as unresolvable rather than silently accepting them.
      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --no-progress
            '.agents/**/*.md' 'docs/**/*.md' 'upgrade-test/**/*.md'
          fail: true

      # Two rules lychee cannot express. Stray agent markup is repo-specific, and lychee parses a
      # Windows drive-qualified target such as C:\docs\a.md as a "c:" URI scheme and excludes it
      # from checking entirely, so that form has to be caught by pattern. The pattern is kept
      # identical to DOCS_POLICY_PATTERN in CICD/gitHooks/pre-commit.sh; the *scope* deliberately
      # differs - CI sweeps the whole tree as a backstop, the hook only looks at staged markdown so
      # a pre-existing violation elsewhere cannot block an unrelated commit.
      - name: Check documentation policy
        run: |
          if grep -rnE '</?CodeContent>|<parameter name="|</parameter>|<ArtifactMetadata>|(\]\(|\]:[[:space:]]*)<?[A-Za-z]:[\\/]' \
               .agents docs upgrade-test --include='*.md'; then
            echo "::error::Documentation policy violations found (see matches above)."
            exit 1
          fi

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: verify label of PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            if (pr.labels.length === 0) {
              core.setFailed("❌ Please add at least one label.");
            } else {
              console.log(`✅ Labels found.`);
            }      
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Run lint
        run: ./gradlew lintDebug

      - name: upload html lint report
        uses: actions/upload-artifact@v7
        with:
          name: lint result
          path: app/build/reports/lint-results-debug.html

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Detect Modified Files and Map UI Tests
        id: test_mapping
        run: |
          TARGET_BRANCH="${{ github.base_ref || 'master' }}"
          git fetch origin "$TARGET_BRANCH"
          MODIFIED_FILES=$(git diff --name-only "origin/$TARGET_BRANCH...HEAD")
          echo "Modified files:"
          echo "$MODIFIED_FILES"

          TESTS=()
          FALLBACK="false"

          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            if [[ "$file" == app/src/main/java/com/andryoga/safebox/ui/login/* ]]; then
              TESTS+=("com.andryoga.safebox.e2e.LoginBiometricAndHintE2ETest")
            elif [[ "$file" == app/src/main/java/com/andryoga/safebox/ui/home/records/* ]]; then
              TESTS+=("com.andryoga.safebox.e2e.RecordsSearchAndFilterE2ETest")
            elif [[ "$file" == app/src/main/java/com/andryoga/safebox/worker/* ]] || [[ "$file" == *backupAndRestore/* ]]; then
              TESTS+=("com.andryoga.safebox.ui.home.backupAndRestore.BackupAndRestoreWorkersTest")
            elif [[ "$file" == app/* ]] || [[ "$file" == gradle* ]] || [[ "$file" == *.gradle ]] || [[ "$file" == *.properties ]]; then
              FALLBACK="true"
            fi
          done <<< "$MODIFIED_FILES"

          UNIQUE_TESTS=()
          if [ ${#TESTS[@]} -gt 0 ]; then
            while IFS= read -r test_class; do
              if [ -n "$test_class" ]; then
                UNIQUE_TESTS+=("$test_class")
              fi
            done < <(printf "%s\n" "${TESTS[@]}" | sort -u)
          fi

          if [ "$FALLBACK" = "true" ]; then
            echo "Core or build files modified. Running full test suite."
            echo "AFFECTED_TESTS=" >> $GITHUB_ENV
          elif [ ${#UNIQUE_TESTS[@]} -gt 0 ]; then
            AFFECTED=$(IFS=,; echo "${UNIQUE_TESTS[*]}")
            echo "Mapped affected tests: $AFFECTED"
            echo "AFFECTED_TESTS=$AFFECTED" >> $GITHUB_ENV
          else
            echo "No application or build files modified. Skipping UI tests."
            echo "AFFECTED_TESTS=SKIP" >> $GITHUB_ENV
          fi

      - name: Run Instrumented UI Tests (Gradle Managed Device)
        run: |
          if [ "$AFFECTED_TESTS" = "SKIP" ]; then
            echo "Skipping UI tests as no application or build files were modified."
          elif [ -n "$AFFECTED_TESTS" ]; then
            ./gradlew pixel8Api34DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=$AFFECTED_TESTS --stacktrace
          else
            ./gradlew pixel8Api34DebugAndroidTest --stacktrace
          fi

      - name: upload test result
        if: always() # Upload even if tests fail
        uses: actions/upload-artifact@v7
        with:
          name: Test Reports (Unit & UI)
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/managedDevice/

  debug_pipeline:
    needs:
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Build debug apk
        run: ./gradlew assembleDebug --scan

      - name: upload debug apk
        uses: actions/upload-artifact@v7
        with:
          name: debug app
          path: app/build/outputs/apk/debug/SafeBox-debug.apk

  qa_pipeline:
    needs:
      - quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Build QA apk
        run: ./gradlew assembleQa --scan

      - name: Upload QA APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name == 'pull_request' && format('SafeBox-QA-PR-{0}', github.event.pull_request.number) || 'SafeBox-QA-Master' }}
          path: app/build/outputs/apk/qa/*.apk
          retention-days: 7

      - name: upload QA mapping file
        uses: actions/upload-artifact@v7
        with:
          name: qaMapping
          path: app/build/outputs/mapping/qa/mapping.txt

      - name: upload QA symbols file to crashlytics
        run: ./gradlew uploadCrashlyticsSymbolFileQa
