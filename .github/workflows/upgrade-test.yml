name: Upgrade Test (manual)

# Never runs automatically. This is the MR1 skeleton: it proves the harness can install a shipped
# QA APK, seed it, upgrade in place and re-run against the same /data. Wiring it into the release
# pipeline behind the RC condition, with the derived baseline matrix, is MR6 - see
# docs/testing/upgrade-testing.md section 10.
#
# Two triggers, because workflow_dispatch alone cannot reach this branch: GitHub only offers the
# "Run workflow" button, and only accepts an API dispatch, for workflows that exist on the default
# branch. Until this merges to master there is no way to dispatch it at all. Labelling the pull
# request runs the workflow from the PR's own head branch, which is the only way to get evidence
# that the job works before the job is merged - and stays useful afterwards for the MRs that add
# phases, since an ordinary push still costs nothing.
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: >-
          Baseline to upgrade from: a rule resolved by scripts/resolve-baselines.sh
          (previous, schema-boundary, oldest) or an explicit tag such as v2.0.4.0.
        required: true
        default: previous
  pull_request:
    types: [ labeled ]

jobs:
  upgrade_test:
    # An unlabelled push must not start a 20-minute emulator job, so the label is the whole gate.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-upgrade-test'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The harness is only as trustworthy as the check that says tests actually ran, so that
      # check is itself tested, first, before any emulator time is spent.
      - name: Verify the zero-test guard
        run: ./scripts/tests/instrumentation-guard-test.sh

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      # BASELINE_INPUT arrives as an environment variable rather than being interpolated into the
      # script body. A `${{ }}` expansion is pasted in as source before bash ever sees it, so a
      # quote in the input would end the assignment and the rest would run as commands; the label
      # path has no input at all and falls back to the default rule.
      - name: Resolve the baseline tag
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_INPUT: ${{ inputs.baseline || 'previous' }}
        run: |
          case "$BASELINE_INPUT" in
            previous|schema-boundary|oldest)
              TAG=$(./scripts/resolve-baselines.sh --rule "$BASELINE_INPUT")
              ;;
            *)
              # Anything not a known rule is treated as an explicit tag, and must look like one -
              # this value reaches a shell argument and an artifact name further down.
              if ! printf '%s' "$BASELINE_INPUT" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
                echo "::error::'$BASELINE_INPUT' is neither a baseline rule nor a vMAJOR.MINOR.DB.FIX tag"
                exit 1
              fi
              TAG="$BASELINE_INPUT"
              ;;
          esac
          if [ -z "$TAG" ]; then
            echo "::error::could not resolve a baseline from '$BASELINE_INPUT'"
            exit 1
          fi
          echo "Baseline: $TAG"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"

      - name: Download the baseline QA APK
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ steps.baseline.outputs.tag }}
        run: ./scripts/fetch-baseline-apk.sh "$BASELINE_TAG" old-apk/

      # qa, not debug: three build types mean three applicationIds, and Android refuses to upgrade
      # one into another. qa -> qa is the only vehicle available.
      - name: Build the QA APK under test and the harness
        env:
          # app/build.gradle computes versionCode as (GITHUB_RUN_NUMBER ?: 9999984) + 15, and
          # GITHUB_RUN_NUMBER counts runs of *this* workflow only. A workflow added by this PR
          # therefore starts at 1 and builds versionCode 16, which is below the 23 of the released
          # baseline, and the run aborts before installing anything. Pinning the variable to the
          # same fallback local builds use yields 9999999: higher than anything ever shipped, and
          # identical to what the harness is exercised with locally.
          #
          # MR6 must drop this. Once the upgrade test runs inside the release pipeline it has to
          # install the actual RC artifact, not a rebuild with an invented version.
          GITHUB_RUN_NUMBER: 9999984
        run: ./gradlew assembleQa :upgrade-test:assembleDebug

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 only to start (decision 6). aosp-atd is sufficient because ML Kit is the bundled
      # barcode-scanning artifact, so no Google Play services are needed.
      - name: Run the upgrade test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          script: ./scripts/run-upgrade-test.sh old-apk/SafeBox-qa.apk app/build/outputs/apk/qa/SafeBox-qa.apk

      - name: Upload harness output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-${{ steps.baseline.outputs.tag }}
          path: upgrade-test-out/
