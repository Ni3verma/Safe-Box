name: Manual UI Test Runner

on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: 'Optional test filter (e.g. -Pandroid.testInstrumentationRunnerArguments.class=com.andryoga.safebox.e2e.LoginBiometricAndHintE2ETest)'
        required: false
        default: ''

jobs:
  run_ui_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented UI Tests (Gradle Managed Device)
        run: ./gradlew pixel8Api34DebugAndroidTest --stacktrace ${{ github.event.inputs.test_filter }}

      - name: Upload Test Report
        if: always() # Upload report even if test fails
        uses: actions/upload-artifact@v7
        with:
          name: UI-Test-Report
          path: app/build/reports/androidTests/managedDevice/
